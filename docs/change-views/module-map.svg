<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><rect width="980" height="330" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#666"/></marker></defs><text x="490.0" y="28.0" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">Where Faster-FermiNet changes the computation (highlighted = changed)</text><rect x="20" y="60" width="155" height="80" rx="8" fill="#F2F2F2" stroke="#999"/><text x="97.0" y="92.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">KFAC training step</text><text x="97.0" y="110.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#444">pmap(_step): loss,</text><text x="97.0" y="124.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#444">gradient, curvature</text><path d="M177,100 L188,100" stroke="#666" stroke-width="2" marker-end="url(#a)"/><rect x="190" y="60" width="155" height="80" rx="8" fill="#F2F2F2" stroke="#999"/><text x="267.0" y="92.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">Local energy</text><text x="267.0" y="110.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#444">kinetic term via</text><text x="267.0" y="124.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#444">jax.linearize(grad</text><text x="267.0" y="138.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#444">log|psi|)</text><path d="M347,100 L358,100" stroke="#666" stroke-width="2" marker-end="url(#a)"/><rect x="360" y="60" width="155" height="80" rx="8" fill="#FFF3C4" stroke="#999"/><text x="437.0" y="92.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">Hessian-diagonal loop</text><text x="437.0" y="110.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#444">fori_loop over 3N</text><text x="437.0" y="124.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#444">directions, unroll=2</text><path d="M517,100 L528,100" stroke="#666" stroke-width="2" marker-end="url(#a)"/><rect x="530" y="60" width="155" height="80" rx="8" fill="#F2F2F2" stroke="#999"/><text x="607.0" y="92.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">slogdet JVP / transpose</text><text x="607.0" y="110.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#444">custom_linear_solve -></text><text x="607.0" y="124.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#444">lu_solve</text><path d="M687,100 L698,100" stroke="#666" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="60" width="155" height="80" rx="8" fill="#FFF3C4" stroke="#999"/><text x="777.0" y="92.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">triangular_solve_p</text><text x="777.0" y="110.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#444">CUDA lowering rule</text><rect x="20" y="185" width="270" height="125" rx="8" fill="#FFF3C4" stroke="#999"/><text x="155.0" y="207.0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">Hessian-diagonal loop</text><text x="155.0" y="227.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">fori_loop(..., unroll=2): same</text><text x="155.0" y="243.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">accumulation order val + h(0) + h(1)</text><text x="155.0" y="259.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">+ ...; two independent HVPs per</text><text x="155.0" y="275.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">loop trip for XLA to schedule</text><rect x="320" y="185" width="270" height="125" rx="8" fill="#F2F2F2" stroke="#999"/><text x="455.0" y="207.0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">all other solves</text><text x="455.0" y="227.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">e.g. KFAC factor inverses and</text><text x="455.0" y="243.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">unbatched / non-square systems:</text><text x="455.0" y="259.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">original cuBLAS lowering,</text><text x="455.0" y="275.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">unchanged</text><rect x="620" y="185" width="340" height="125" rx="8" fill="#FFF3C4" stroke="#999"/><text x="790.0" y="207.0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">f32, left side, batched, 9 &lt;= n = m &lt;= 64</text><text x="790.0" y="227.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">Pallas/Triton kernel reproducing cuBLAS trsmBatched</text><text x="790.0" y="243.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">bit for bit: 8-row blocks, block partial sums,</text><text x="790.0" y="259.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">in-block FMA chain, IEEE division (inline PTX);</text><text x="790.0" y="275.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">column-major I/O, so neighbouring XLA fusions</text><text x="790.0" y="291.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#333">compile exactly as with cuBLAS</text><path d="M437,142 L200,182" stroke="#666" stroke-width="2" marker-end="url(#a)"/><path d="M777,142 L790,182" stroke="#666" stroke-width="2" marker-end="url(#a)"/><path d="M777,142 L470,182" stroke="#666" stroke-width="2" marker-end="url(#a)"/></svg>
